<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c8704f" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1f1a17" media="(prefers-color-scheme: dark)">
  <meta name="description" content="ハンドメイド作家向けの年末棚卸し＋売上・経費集計アプリ">
  <title>ハンドメイド棚卸し帳</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23c8704f'/%3E%3Cpath d='M9 11h14v12H9z' fill='none' stroke='%23fff' stroke-width='2.5'/%3E%3Cpath d='M12 11V8h8v3' fill='none' stroke='%23fff' stroke-width='2.5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="appbar">
    <div class="appbar-inner">
      <span class="brand">ハンドメイド棚卸し帳</span>
      <h1 id="view-title" class="view-title">ダッシュボード</h1>
    </div>
  </header>

  <main id="main" class="main" tabindex="-1">
    <noscript><p class="card">このアプリを使うには JavaScript を有効にしてください。</p></noscript>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <nav class="tabbar" aria-label="メインメニュー">
    <button type="button" class="tab" data-tab="dashboard" data-testid="tab-dashboard">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4zm10 7h6v-9h-6zM4 20h6v-4H4zm10-11h6V4h-6z"/></svg>
      <span>ホーム</span>
    </button>
    <button type="button" class="tab" data-tab="inventory" data-testid="tab-inventory">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7l8-4 8 4v10l-8 4-8-4zM4 7l8 4 8-4M12 11v10"/></svg>
      <span>棚卸し</span>
    </button>
    <button type="button" class="tab" data-tab="ledger" data-testid="tab-ledger">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6M9 16h3"/></svg>
      <span>売上・経費</span>
    </button>
    <button type="button" class="tab" data-tab="cost" data-testid="tab-cost">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18H6zM9 7h6M9 11h1M12 11h1M15 11h0M9 15h1M12 15h1M9 18h1M12 18h1M15 14v4"/></svg>
      <span>原価計算</span>
    </button>
    <button type="button" class="tab" data-tab="data" data-testid="tab-data">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3zm0 0v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>
      <span>データ</span>
    </button>
  </nav>
</body>
</html>
